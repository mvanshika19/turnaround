<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Know the latest time to turn around on a North Shore hike, so you’re off the trail before dark and below the snow."
    />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Turnaround</title>
    <script>
      // Apply the saved theme before first paint so the page never flashes the wrong colours.
      // Keep the storage key and logic in sync with src/theme/ThemeProvider.tsx.
      (function () {
        var preference = 'system';
        try {
          preference = window.localStorage.getItem('turnaround.theme') || 'system';
        } catch (error) {
          preference = 'system';
        }
        var dark =
          preference === 'dark' ||
          (preference !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
