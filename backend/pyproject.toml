[project]
name = "turnaround-backend"
version = "0.1.0"
description = "Turnaround: latest safe turnaround time for North Shore hikes."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    # Data-science dependencies, used by app/pace (numpy, scipy, gpxpy) and app/conditions (astral).
    "numpy>=2.1",
    "scipy>=1.14",
    "gpxpy>=1.6",
    "astral>=3.2",
    "openai>=1.60",
]

[dependency-groups]
dev = ["ruff"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# The shared contract aliases ``date`` as ``Date`` so field names can be ``date``.
"app/contracts.py" = ["N812"]
